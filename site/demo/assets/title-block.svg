<svg xmlns="http://www.w3.org/2000/svg" width="480" height="180" viewBox="0 0 480 180" font-family="IBM Plex Mono, ui-monospace, monospace">
  <title>Sketch of a note's title block</title>
  <rect width="480" height="180" fill="#f7faf2"/>
  <rect x="10" y="10" width="460" height="160" fill="none" stroke="#6f8f62" stroke-width="2"/>
  <line x1="10" y1="72" x2="470" y2="72" stroke="#9db58a"/>
  <line x1="10" y1="118" x2="470" y2="118" stroke="#9db58a"/>
  <line x1="330" y1="118" x2="330" y2="170" stroke="#9db58a"/>
  <g fill="#4c5d50" font-size="10" letter-spacing="1.2">
    <text x="20" y="28">SUBJECT</text>
    <text x="20" y="88">DESCRIPTION</text>
    <text x="20" y="134">TAGS</text>
    <text x="340" y="134">DATE</text>
  </g>
  <text x="20" y="58" fill="#17241b" font-size="24" font-weight="600" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif">The note's title</text>
  <text x="20" y="106" fill="#17241b" font-size="13" font-family="IBM Plex Sans, system-ui, sans-serif">Its one-line summary</text>
  <text x="20" y="156" fill="#1f5a33" font-size="12">docs  design</text>
  <text x="340" y="156" fill="#17241b" font-size="12" font-weight="500">Updated 2026-10-28</text>
</svg>
